name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The pack-era steps (generate-packs, validate-leaves) referenced scripts
      # deleted when the pack experiment was retired (#3). The workflow was
      # never updated, so EVERY PR since failed validate and merged UNSTABLE —
      # a dead check trains people to merge over red, which is worse than no
      # check. What CI can actually verify without the private monorepo:
      - name: plugin manifest and marketplace parse, versions agree
        run: |
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('.claude-plugin/marketplace.json', 'utf8'));
            const p = JSON.parse(fs.readFileSync('plugins/ritual/.claude-plugin/plugin.json', 'utf8'));
            if (!p.version) throw new Error('plugin.json has no version');
            console.log('plugin', p.name, p.version, '| marketplace entries:', (m.plugins ?? []).length);
          "

      - name: the shipped surface is complete
        # SKILL.md + the five commands + SETUP.md: what an install actually
        # copies. A sync that half-ran leaves this incomplete and otherwise
        # looks fine until a user hits the missing piece.
        run: |
          set -e
          test -f plugins/ritual/skills/build/SKILL.md
          for c in resume lite lineage context-pulse status; do
            test -f "plugins/ritual/commands/$c.md" || { echo "missing command: $c"; exit 1; }
          done
          test -f plugins/ritual/SETUP.md
          grep -q "never mention these notes" plugins/ritual/SETUP.md
          echo "skill, 5 commands, SETUP.md all present"

      # Upstream-drift checking still requires the private monorepo and stays
      # a local maintainer step: scripts/sync-ritual-skill.mjs against a checkout.
